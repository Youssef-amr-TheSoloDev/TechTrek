<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="projectStyle.css">
    <title>session 3 project</title>
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>Simple Greeting</h1>
            <input type="text" id="name-Input" placeholder="eg. Youssef Amr">
            <input type="button" value="Greet Me" onclick="GreetUser()">
            <h4 id="name-output"></h4>
        </div>
        <div class="card">
            <h1>Counter</h1>
            <h4 id="counter-output">00</h4>
            <div class="btn-container">
                <input type="button" value="increase" onclick="increaseCounter()">
                <input type="button" value="decrease" onclick="decreaseCounter()">
            </div>
        </div>
        <div class="card">
            <h1>Change Background Color</h1>
            <input type="button" value="Change Color" onclick="ChangeBackgroundColor()">
        </div>
    </div>
</body>

</html>
