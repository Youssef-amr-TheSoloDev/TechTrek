<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorer · Product Details</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .product-detail-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        .product-detail-card {
            background: white;
            border-radius: 32px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            padding: 2rem;
        }

        .product-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5rem;
            align-items: start;
        }

        .product-detail-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            background: #fafafa;
            border-radius: 20px;
            padding: 1.5rem;
        }

        .product-detail-info h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }

        .product-detail-info .brand {
            color: #666;
            font-size: 1rem;
            margin-bottom: 1rem;
            display: block;
        }

        .product-detail-info .price-large {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            margin: 1rem 0 0.5rem;
        }

        .product-detail-info .price-large small {
            font-weight: 400;
            font-size: 1rem;
            color: #888;
            text-decoration: line-through;
            margin-left: 0.8rem;
        }

        .product-detail-info .badge {
            display: inline-block;
            background: var(--accent);
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .product-detail-info .meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem 1.5rem;
            margin: 1.5rem 0;
            padding: 1rem 0;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }

        .product-detail-info .meta-item {
            display: flex;
            flex-direction: column;
        }

        .product-detail-info .meta-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #888;
        }

        .product-detail-info .meta-value {
            font-weight: 500;
            margin-top: 0.1rem;
        }

        .product-detail-info .description {
            color: #444;
            line-height: 1.6;
            margin: 1rem 0;
        }

        .product-detail-info .back-link {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 0.6rem 1.8rem;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 500;
            transition: 0.15s;
            margin-top: 1rem;
        }

        .product-detail-info .back-link:hover {
            background: #222;
            transform: scale(0.98);
        }

        .reviews-section {
            margin-top: 2.5rem;
            border-top: 1px solid #eee;
            padding-top: 1.5rem;
        }

        .review-item {
            background: #f9f9f9;
            border-radius: 16px;
            padding: 1rem;
            margin-bottom: 0.8rem;
        }

        .review-item .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .review-item .reviewer {
            font-weight: 600;
        }

        .review-item .review-rating {
            color: #f5a623;
        }

        .review-item .review-comment {
            color: #444;
            margin-top: 0.3rem;
        }

        .review-item .review-date {
            color: #888;
            font-size: 0.8rem;
        }

        .error-message {
            text-align: center;
            padding: 3rem 1rem;
            color: #b00020;
        }

        .loading-message {
            text-align: center;
            padding: 3rem 1rem;
            color: #555;
        }

        @media (max-width: 768px) {
            .product-detail-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .product-detail-info .meta-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <span class="nav-brand">🛍️ Explorer</span>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="product.html" class="active">Product details</a>
            </div>
        </div>
    </nav>

    <main class="container product-detail-container">
        <div id="productDetailContainer">
        </div>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <span>© 2026 Explorer · built with dummyJSON</span>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const container = document.getElementById('productDetailContainer');

            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            if (!productId) {
                container.innerHTML = `
          <div class="product-detail-card error-message">
            <h2>No product selected</h2>
            <p style="margin: 1rem 0;">Please go back to the catalog and select a product.</p>
            <a href="index.html" class="back-link">← Back to catalog</a>
          </div>
        `;
                return;
            }

            container.innerHTML = `
        <div class="product-detail-card loading-message">
          <p>Loading product details...</p>
        </div>
      `;

            async function fetchProductDetails() {
                try {
                    const response = await fetch(`https://dummyjson.com/products/${productId}`);

                    if (!response.ok) {
                        throw new Error(`Product not found (status ${response.status})`);
                    }

                    const product = await response.json();

                    // Render product details
                    renderProduct(product);

                } catch (error) {
                    console.error('Error fetching product:', error);
                    container.innerHTML = `
            <div class="product-detail-card error-message">
              <h2> ${error.message || 'Failed to load product'}</h2>
              <p style="margin: 1rem 0;">Please try again or go back to the catalog.</p>
              <a href="index.html" class="back-link">← Back to catalog</a>
            </div>
          `;
                }
            }

            function renderProduct(product) {
                const discount = product.discountPercentage ? `${Math.round(product.discountPercentage)}% off` : '';
                const originalPrice = product.price ? (product.price / (1 - (product.discountPercentage || 0) / 100)).toFixed(2) : '';
                const ratingStars = product.rating ? '⭐ '.repeat(Math.round(product.rating)) + ' (' + product.rating.toFixed(1) + '/5)' : 'Not rated';

                container.innerHTML = `
          <div class="product-detail-card">
            <div class="product-detail-grid">
              <!-- Image column -->
              <div>
                <img src="${product.thumbnail || 'https://dummyjson.com/image/i/products/1/thumbnail.jpg'}" 
                     alt="${product.title}" 
                     class="product-detail-image">
                ${product.images && product.images.length > 1 ? `
                  <div style="display: flex; gap: 0.5rem; margin-top: 0.8rem; flex-wrap: wrap;">
                    ${product.images.slice(0, 4).map(img => `
                      <img src="${img}" alt="product image" 
                           style="width: 70px; height: 70px; object-fit: cover; border-radius: 12px; border: 2px solid #eee; cursor: pointer;"
                           onclick="this.parentElement.parentElement.querySelector('.product-detail-image').src = this.src">
                    `).join('')}
                  </div>
                ` : ''}
              </div>
              
              <!-- Info column -->
              <div class="product-detail-info">
                <h1>${product.title}</h1>
                ${product.brand ? `<span class="brand">by ${product.brand}</span>` : ''}
                
                <div class="price-large">
                  $${product.price?.toFixed(2)}
                  ${originalPrice ? `<small>$${originalPrice}</small>` : ''}
                  ${discount ? `<span class="badge" style="margin-left: 0.8rem;">${discount}</span>` : ''}
                </div>
                
                <div style="margin: 0.5rem 0;">
                  <span style="color: #f5a623;">${ratingStars}</span>
                </div>
                
                <div class="meta-grid">
                  <div class="meta-item">
                    <span class="meta-label">Category</span>
                    <span class="meta-value">${product.category || '—'}</span>
                  </div>
                  <div class="meta-item">
                    <span class="meta-label">Stock</span>
                    <span class="meta-value">${product.stock ?? '—'} (${product.availabilityStatus || 'Unknown'})</span>
                  </div>
                  <div class="meta-item">
                    <span class="meta-label">SKU</span>
                    <span class="meta-value">${product.sku || '—'}</span>
                  </div>
                  <div class="meta-item">
                    <span class="meta-label">Weight</span>
                    <span class="meta-value">${product.weight ? product.weight + ' kg' : '—'}</span>
                  </div>
                  ${product.warrantyInformation ? `
                    <div class="meta-item">
                      <span class="meta-label">Warranty</span>
                      <span class="meta-value">${product.warrantyInformation}</span>
                    </div>
                  ` : ''}
                  ${product.returnPolicy ? `
                    <div class="meta-item">
                      <span class="meta-label">Return Policy</span>
                      <span class="meta-value">${product.returnPolicy}</span>
                    </div>
                  ` : ''}
                  ${product.shippingInformation ? `
                    <div class="meta-item">
                      <span class="meta-label">Shipping</span>
                      <span class="meta-value">${product.shippingInformation}</span>
                    </div>
                  ` : ''}
                  ${product.minimumOrderQuantity ? `
                    <div class="meta-item">
                      <span class="meta-label">Min. Order</span>
                      <span class="meta-value">${product.minimumOrderQuantity}</span>
                    </div>
                  ` : ''}
                </div>
                
                <div class="description">
                  <strong>Description</strong>
                  <p style="margin-top: 0.3rem;">${product.description || 'No description available.'}</p>
                </div>
                
                <a href="index.html" class="back-link">← Back to catalog</a>
              </div>
            </div>
            
            <!-- Reviews section -->
            ${product.reviews && product.reviews.length > 0 ? `
              <div class="reviews-section">
                <h3 style="margin-bottom: 1rem;">Customer Reviews (${product.reviews.length})</h3>
                ${product.reviews.slice(0, 5).map(review => `
                  <div class="review-item">
                    <div class="review-header">
                      <span class="reviewer">${review.reviewerName || 'Anonymous'}</span>
                      <span class="review-rating">⭐ ${review.rating}/5</span>
                    </div>
                    <p class="review-comment">${review.comment || ''}</p>
                    <span class="review-date">${review.date ? new Date(review.date).toLocaleDateString() : ''}</span>
                  </div>
                `).join('')}
                ${product.reviews.length > 5 ? `<p style="color: #888; font-style: italic; margin-top: 0.5rem;">+ ${product.reviews.length - 5} more reviews</p>` : ''}
              </div>
            ` : ''}
          </div>
        `;
            }

            fetchProductDetails();
        });
    </script>
</body>

</html>
