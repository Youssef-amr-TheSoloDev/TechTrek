<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="style.css">
    <title>Session 6 JS</title>

<body>
    <div>
        <input type="text" name="" id="price" placeholder="Price" onchange="CalculateTotalPrice()">
        <input type="number" name="" id="quantity" placeholder="2" onchange="CalculateTotalPrice()">
        <input type="button" value="Buy" id="OfferBtn">

        <br>
        <div style="flex-direction: row; gap: 2em; align-items: center; justify-content: center;">
            <h1 id="Save" style="color: greenyellow"></h1>
            <h2 id="TotalPrice" style="color: #eee;">0$</h2>
        </div>
    </div>

    <script>
        let offerCodeInput = document.getElementById("price");
        let quantityInput = document.getElementById("quantity");
        let SavePercentage = document.getElementById("Save");
        let TotalPrice = document.getElementById("TotalPrice");

        let TotalProductsPrice = 0;
        const offerPrice = 500;

        function CalculateTotalPrice() {
            TotalProductsPrice = Number(offerCodeInput.value) * Number(quantityInput.value);

            UpdatePriceOutput();
            console.log(`${TotalProductsPrice} = ${offerCodeInput.value} * ${quantityInput.value}`);
        }

        function UpdatePriceOutput() {

            if (TotalProductsPrice >= offerPrice) {
                SavePercentage.textContent = `15%`;
                TotalPrice.textContent = (0.85 * TotalProductsPrice) + "$";
                return;
            }
            else {
                SavePercentage.textContent = '';
            }

            TotalPrice.textContent = TotalProductsPrice + "$";
        }

        let i = 10;
        while (i !== 0) {
            console.log(i--);

            document.body.innerHTML += `<p>${i}</p>`
