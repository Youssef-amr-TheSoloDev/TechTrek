        function renderStudents(list) {
            if (list.length === 0) {
                SearchOut.innerHTML = `
                        <div class="text-secondary-emphasis" style="opacity:0.6;">
                            <i class="bi bi-inbox me-1"></i> No students match your search.
                        </div>
                    `;
            } else {
                let html = '<div class="d-flex flex-column gap-3">';
                list.forEach(s => {
                    html += `
                            <div class="card border-0 shadow-sm p-3 rounded-4 bg-white">
                                <div class="row align-items-center g-2">
                                    <div class="col-md-6">
                                        <h5 class="fw-semibold mb-0">${s.name}</h5>
                                        <span class="badge bg-light text-secondary fw-normal rounded-pill me-1">Age ${s.age}</span>
                                        <span class="badge bg-light text-secondary fw-normal rounded-pill">${s.course}</span>
                                    </div>
                                    <div class="col-md-4 text-md-end">
                                        <span class="fw-bold text-primary">${s.grade}%</span>
                                    </div>
                                    <div class="col-md-2 text-md-end">
                                        <button class="btn btn-outline-danger btn-sm rounded-pill px-3" 
                                                onclick="deleteStudent(${s.id})">
                                            <i class="bi bi-trash3"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                });
                html += '</div>';
                SearchOut.innerHTML = html;
            }

            StudentNumber.textContent = String(list.length).padStart(4, '0');
        }

        function Search() {
            const query = SearchText.value.trim().toLowerCase();
            let filtered = students;

            if (query) {
                filtered = students.filter(s =>
                    s.name.toLowerCase().includes(query) ||
                    s.course.toLowerCase().includes(query)
                );
            }

            renderStudents(filtered);
        }

        function deleteStudent(id) {
            const idx = students.findIndex(s => s.id === id);
            if (idx !== -1) {
                students.splice(idx, 1);
                Search();
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            SearchText.value = '';
            Search();
